<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com blob: data: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:; worker-src 'self' blob: data:">
  <title>Falkon Dev Kit | VS Code Workbench</title>
  <link rel="stylesheet" href="./vs/workbench/browser/media/style.css">
  <link rel="stylesheet" href="./vs/base/browser/ui/codicons/codicon/codicon.css">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b0c14;
      color: #f1f1f5;
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
    }
    #workbench-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>

<body>
  <div id="workbench-container"></div>
  <script type="module" src="js/tauri-shim.js"></script>
  <script type="module">
    import { create } from './dist/workbench.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('workbench-container');
      try {
        create(container, {
          productConfiguration: {
            nameShort: 'Falkon Dev Kit',
            nameLong: 'Falkon Dev Kit',
            applicationName: 'falkon-dev-kit',
            licenseName: 'MIT'
          }
        });
      } catch (err) {
        console.error('Failed to initialize VS Code Workbench:', err);
      }
    });
  </script>
</body>

</html>
