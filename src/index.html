<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falkon Dev Kit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #181818;
      color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .logo {
      width: 64px;
      height: 64px;
      animation: pulse 1.8s ease-in-out infinite;
    }
    .title {
      font-size: 16px;
      font-weight: 500;
      color: #e0e0e0;
      letter-spacing: 0.5px;
    }
    .status {
      font-size: 12px;
      color: #888888;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid #2d2d2d;
      border-top-color: #0078d4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.85; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } }
  </style>
</head>
<body>
  <div class="splash">
    <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="20" fill="#1e1e1e"/>
      <path d="M25 50L45 70L75 30" stroke="#0078d4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="spinner"></div>
    <div class="title">Falkon Dev Kit</div>
    <div class="status" id="status-text">Connecting to extension host...</div>
  </div>

  <script>
    const SERVER_URL = 'http://127.0.0.1:9888/?tkn=falkon-dev-token';
    const statusText = document.getElementById('status-text');

    async function checkAndRedirect() {
      try {
        const res = await fetch('http://127.0.0.1:9888/?tkn=falkon-dev-token', {
          method: 'HEAD',
          mode: 'no-cors'
        });
        // Server is reachable, navigate directly
        window.location.replace(SERVER_URL);
      } catch (err) {
        statusText.textContent = 'Starting server engine...';
        setTimeout(checkAndRedirect, 300);
      }
    }

    checkAndRedirect();
  </script>
</body>
</html>
