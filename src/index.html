<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com blob: data: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:; worker-src 'self' blob: data:">
  <title>VS Code | Tauri</title>
  <script>
    // Initialize VS Code FileAccess root URI required by VS Code resource loader
    self._VSCODE_FILE_ROOT = window.location.origin + '/';
  </script>
  <link rel="stylesheet" href="./dist/workbench.css">
  <link rel="stylesheet" href="./vs/workbench/browser/media/style.css">
  <link rel="stylesheet" href="./vs/base/browser/ui/codicons/codicon/codicon.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1e1e1e;
      color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", system-ui, "Ubuntu", "Droid Sans", sans-serif;
    }
    #workbench-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #1e1e1e;
    }
  </style>
</head>

<body class="vs-dark">
  <div id="workbench-container" class="monaco-workbench vs-dark"></div>
  <script type="module" src="js/tauri-shim.js"></script>
  <script type="module">
    window.addEventListener('error', (e) => {
      console.error('[Global Error]', e.error || e.message);
    });
    window.addEventListener('unhandledrejection', (e) => {
      console.error('[Unhandled Rejection]', e.reason);
    });

    import { create } from './dist/workbench.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('workbench-container');
      try {
        console.log('[VS Code] Initializing Web Workbench...');
        const workbench = create(container, {
          productConfiguration: {
            nameShort: 'Code - OSS',
            nameLong: 'Code - OSS',
            applicationName: 'code-oss',
            licenseName: 'MIT'
          },
          configurationDefaults: {
            'workbench.colorTheme': 'Default Dark Modern',
            'workbench.preferredDarkColorTheme': 'Default Dark Modern'
          }
        });
        console.log('[VS Code] Workbench created:', workbench);
      } catch (err) {
        console.error('[VS Code] Failed to initialize Workbench:', err);
      }
    });
  </script>
</body>

</html>
