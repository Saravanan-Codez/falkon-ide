[package]
name = "falkon_dev_kit_tauri"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.6.3", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.14"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
